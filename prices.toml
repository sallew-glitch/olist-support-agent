# Prices in USD per million tokens, used only for ESTIMATED cost in traces and summaries.
#
# TODO: verify against the provider's pricing page; these may be out of date.
#   Anthropic: https://www.anthropic.com/pricing (or https://platform.claude.com/docs/en/about-claude/pricing)
#   Last checked by the repo owner against Anthropic's pricing page: 2026-11-04.
#
# A model with no entry here gets no cost estimate (reported as null / "n/a"); nothing is guessed.
# Notes: Claude Haiku 5.5 has a higher rate for prompts over 100K tokens ($0.50 / $2.50); this demo's
# prompts are far below that, so only the lower rate is used. Prompt caching is not used, so cache
# write/read rates are not needed.

[models."claude-haiku-5-5"]
input_per_mtok = 0.10
output_per_mtok = 0.50

[models."claude-sonnet-5-5"]
input_per_mtok = 2.00
output_per_mtok = 10.00
