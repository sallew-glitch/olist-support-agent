[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-support-agent"
version = "0.1.0"
description = "Demo: a hand-written tool-calling support agent over the public Olist dataset (not production)."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.0",
    "openai>=1.40",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
